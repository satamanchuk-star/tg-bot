name: Build and Deploy

on:
  push:
    branches:
      - main
  # Позволяет запускать деплой вручную (в т.ч. из Claude через GitHub API).
  workflow_dispatch:

jobs:
  # Тесты ПЕРЕД сборкой: прямой push в main (в т.ч. правка через веб-интерфейс)
  # раньше уезжал в прод непроверенным — quality-gate гонялся только на PR.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full test suite
        run: |
          pytest -q tests/ infra_catalog/tests/

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push with retry
        env:
          BUILD_VERSION: "#${{ github.run_number }} (${{ steps.sha.outputs.short }})"
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail

          for attempt in 1 2; do
            echo "Build attempt ${attempt}/2"

            if docker buildx build \
              --file Dockerfile \
              --platform linux/amd64 \
              --tag satamanchuk/alexbot:latest \
              --tag "satamanchuk/alexbot:${SHORT_SHA}" \
              --push \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --build-arg "BUILD_VERSION=${BUILD_VERSION}" \
              .; then
              echo "Build and push succeeded on attempt ${attempt}."
              exit 0
            fi

            if [ "${attempt}" -eq 1 ]; then
              echo "First attempt failed due to a transient error, retrying in 15 seconds..."
              sleep 15
            fi
          done

          echo "Build and push failed after 2 attempts."
          exit 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Деплой только если заданы серверные секреты (иначе шаг просто пропускается).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      # Готовим .env из единственного секрета BOT_ENV (всё содержимое env-файла).
      # Секрет маскируется в логах GitHub; на диск раннера попадает эфемерно.
      - name: Render .env from secret
        env:
          BOT_ENV: ${{ secrets.BOT_ENV }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_ENV}" ]; then
            echo "::error::Секрет BOT_ENV не задан — нечего деплоить."
            exit 1
          fi
          printf '%s\n' "${BOT_ENV}" > .env
          # 644, чтобы scp-action (пакует файлы в своём контейнере под другим uid)
          # смог прочитать файл. Строгие права 600 ставятся на сервере при деплое.
          chmod 644 .env

      # Копируем docker-compose.yaml и .env на сервер.
      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yaml,.env"
          target: /opt/alexbot

      # Тянем свежий образ и перезапускаем.
      - name: Pull image and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/alexbot
            chmod 600 .env
            mkdir -p data

            # Запоминаем работающий образ: если новый не поднимется — вернём его.
            PREV_IMAGE=$(docker inspect --format '{{.Image}}' alexbot 2>/dev/null || echo "")
            if [ -n "$PREV_IMAGE" ]; then
              docker tag "$PREV_IMAGE" satamanchuk/alexbot:previous
              echo "Предыдущий образ сохранён для отката: $PREV_IMAGE"
            fi

            docker compose pull
            docker compose up -d --remove-orphans

            # Ждём маркер готовности из app/main.py (до 2 минут: на старте
            # прогреваются база знаний и сид вопросов).
            READY=0
            for i in $(seq 1 60); do
              if docker logs alexbot 2>&1 | grep -q "BOT_READY"; then
                READY=1
                break
              fi
              STATE=$(docker inspect --format '{{.State.Status}}' alexbot 2>/dev/null || echo missing)
              RESTARTS=$(docker inspect --format '{{.RestartCount}}' alexbot 2>/dev/null || echo 0)
              if [ "$STATE" = "exited" ] || [ "$RESTARTS" -gt 2 ]; then
                echo "Контейнер в состоянии $STATE, перезапусков: $RESTARTS — дальше не ждём."
                break
              fi
              sleep 2
            done

            if [ "$READY" = "1" ]; then
              echo "✅ Бот поднялся и начал polling."
              docker image prune -f
              exit 0
            fi

            echo "❌ Бот не сообщил о готовности. Последние логи:"
            docker logs alexbot --tail 60 2>&1 || true

            if docker image inspect satamanchuk/alexbot:previous >/dev/null 2>&1; then
              echo "↩️ Откат на предыдущий образ."
              docker tag satamanchuk/alexbot:previous satamanchuk/alexbot:latest
              docker compose up -d --force-recreate
              sleep 10
              docker logs alexbot --tail 20 2>&1 || true
              echo "Откат выполнен: на сервере снова предыдущая версия."
            else
              echo "⚠️ Предыдущего образа нет — откатывать не на что."
            fi
            exit 1
